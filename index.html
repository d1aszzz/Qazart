<style>
:root{--bg:#0F172A;--card:#1E293B;--text:#F1F5F9;--muted:#94A3B8;--line:rgba(148,163,184,.18);--cy:#00E5FF;--gold:#F59E0B;--glass:rgba(30,41,59,.72);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html[data-theme=light]{--bg:#F1F5F9;--card:#FFFFFF;--text:#0F172A;--muted:#64748B;--line:rgba(15,23,42,.12);--cy:#0891B2;--gold:#D97706;--glass:rgba(255,255,255,.8)}
html,body{height:100%;margin:0}
body{background:radial-gradient(circle at 50% 0,#16264a,#070d1c);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);display:flex;align-items:center;justify-content:center}
html[data-theme=light] body{background:#CBD5E1}
#app{position:relative;width:100%;max-width:410px;height:min(100%,880px);background:var(--bg);overflow:hidden;display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(0,0,0,.5)}
@media(min-width:500px){#app{border-radius:40px;border:1px solid var(--line);height:min(96%,860px)}}
.scr{display:none;flex:1;overflow-y:auto;padding:16px 16px 110px;animation:fade .3s}
.scr.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.glass{background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.muted{color:var(--muted)}.cy{color:var(--cy)}.gold{color:var(--gold)}
.btn{border-radius:12px;padding:9px 14px;font-size:13px;font-weight:600;border:1px solid var(--line);background:transparent;color:var(--text);cursor:pointer;transition:.2s}
.btn.p{background:rgba(0,229,255,.14);border-color:var(--cy);color:var(--cy)}
.btn:hover{transform:translateY(-1px)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:var(--muted);background:none;border:0;cursor:pointer;padding:6px 0}
.tab span{font-size:19px}.tab.on{color:var(--cy)}
#nav{position:absolute;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;border-radius:24px;border:1px solid var(--line);padding:4px 6px;z-index:5}
#zere{width:66px;height:66px;margin-top:-34px;border-radius:50%;border:2px solid var(--cy);cursor:pointer;background:radial-gradient(circle at 35% 30%,#7df3ff,#0891b2 60%,#0F172A);box-shadow:0 0 28px rgba(0,229,255,.6);animation:pulse 2.4s infinite;font-size:11px;font-weight:700;color:#04202a}
@keyframes pulse{50%{box-shadow:0 0 44px rgba(0,229,255,.95)}}
.node{border-radius:12px;border:1px solid var(--line);background:var(--card);padding:8px 14px;font-size:13px;cursor:pointer;transition:.2s;color:var(--text)}
.node.on{border-color:var(--cy);box-shadow:0 0 18px rgba(0,229,255,.45);color:var(--cy)}
.node.g{border-color:var(--gold)}
.vl{width:1px;height:18px;background:var(--cy);opacity:.5;margin:0 auto}
.opt{width:100%;text-align:left;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--text);font-size:13px;margin-top:8px;cursor:pointer}
.opt.ok{border-color:#22c55e;background:rgba(34,197,94,.15)}.opt.no{border-color:#ef4444;background:rgba(239,68,68,.15)}
.seg{display:flex;border-radius:12px;border:1px solid var(--line);padding:3px;background:var(--card)}
.seg button{flex:1;padding:7px;border-radius:9px;border:0;background:none;color:var(--muted);font-size:13px;font-weight:600;cursor:pointer}
.seg button.on{background:rgba(0,229,255,.16);color:var(--cy)}
.msg{max-width:84%;padding:10px 13px;border-radius:16px;font-size:14px;line-height:1.4;margin-bottom:10px;animation:fade .25s}
.msg.u{margin-left:auto;background:var(--cy);color:#04202a;border-bottom-right-radius:4px}
.msg.a{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}
.bar{width:5px;border-radius:3px;background:var(--cy);animation:wave .8s infinite ease-in-out}
@keyframes wave{0%,100%{height:8px}50%{height:34px}}
#ai{position:absolute;inset:0;z-index:20;background:var(--bg);display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
#ai.on{display:flex}
#toast{position:absolute;left:50%;top:18px;transform:translate(-50%,-80px);z-index:50;padding:10px 16px;border-radius:14px;font-size:13px;transition:.35s;border:1px solid var(--cy);max-width:90%;text-align:center}
#toast.on{transform:translate(-50%,0)}
.sw{width:46px;height:26px;border-radius:13px;background:var(--line);position:relative;cursor:pointer;border:0;transition:.2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--cy)}.sw.on::after{left:23px}
.tn{margin:4px 0}.row{display:flex;align-items:center;gap:6px}
.kids{margin-left:10px;padding-left:12px;border-left:1px solid var(--zc,var(--cy))}.tn.c>.kids{display:none}
.tg{width:22px;height:22px;border-radius:6px;border:1px solid var(--line);background:none;color:var(--muted);font-size:11px;cursor:pointer}.tn.c>.row>.tg{transform:rotate(-90deg)}
.z0{--zc:#00E5FF}.z1{--zc:#F59E0B}.z2{--zc:#A78BFA}.node{border-color:var(--zc,var(--line))}.node.my{background:rgba(245,158,11,.22)}
#login{position:absolute;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;justify-content:center;padding:28px}
.in{width:100%;border-radius:12px;padding:11px 13px;font-size:14px;outline:none;margin-top:10px;background:var(--card);border:1px solid var(--line);color:var(--text)}

@media(min-width:900px){
 #app{max-width:1120px;width:94vw;height:min(94vh,800px);border-radius:28px;flex-direction:row}
 #nav{position:static;order:-1;flex-direction:column;justify-content:flex-start;gap:8px;width:92px;border-radius:0;border:0;border-right:1px solid var(--line);padding:22px 8px;margin:0;background:var(--card)}
 #nav .tab{flex:none;width:100%;padding:12px 0;border-radius:14px}
 #nav .tab.on{background:rgba(0,229,255,.1)}
 #zere{margin:6px 0;width:60px;height:60px}
 .scr{flex:1;padding:30px 40px 40px}
 .scr>*{max-width:860px}
 #home .grid{grid-template-columns:repeat(3,minmax(0,1fr))}
 #home .grid>.col-span-2{grid-column:span 1}
 #set>*{max-width:620px}
 #ai{left:auto;width:min(460px,46%);border-left:1px solid var(--line);box-shadow:-20px 0 60px rgba(0,0,0,.35)}
 #login{align-items:center}#login>*{width:100%;max-width:380px}
}
.langbtn{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:12px;border:1px solid var(--cy);background:rgba(0,229,255,.1);color:var(--cy);font-weight:600;font-size:13px;cursor:pointer;transition:.2s}
.langbtn:hover{background:rgba(0,229,255,.18)}
.langbtn svg{width:14px;height:14px;transition:.2s}.langbtn.open svg{transform:rotate(180deg)}
.langmenu{position:absolute;right:0;top:calc(100% + 8px);min-width:190px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 14px 36px rgba(0,0,0,.4);padding:6px;z-index:30}
.langmenu button{display:flex;align-items:center;gap:10px;width:100%;padding:10px;border-radius:10px;background:none;border:0;color:var(--text);cursor:pointer;font-size:14px;text-align:left}
.langmenu button:hover{background:rgba(0,229,255,.1)}
.langmenu button .cd{font-size:11px;font-weight:800;letter-spacing:.06em;width:30px;padding:3px 0;text-align:center;border-radius:6px;background:var(--bg);color:var(--muted)}
.langmenu button.on{color:var(--cy)}.langmenu button.on .cd{background:rgba(0,229,255,.18);color:var(--cy)}
.langmenu button.on::after{content:'✓';margin-left:auto;font-weight:700}
</style>
</head>
<body>
<div id="app">
<div id="toast" class="glass"></div>

<section id="home" class="scr on">
  <div class="flex items-center justify-between mb-4">
    <div class="flex items-center gap-3"><div class="text-xl font-bold"><span class="cy">✻</span> Qazart</div><button id="thm" class="thm" aria-label="Theme">☀️</button></div>
    <div class="w-9 h-9 rounded-full grid place-items-center text-sm font-bold" style="background:linear-gradient(135deg,var(--cy),var(--gold));color:#04202a">А</div>
  </div>
  <h1 class="text-2xl font-extrabold"><span data-i="hello">Сәлем</span>, <span id="hi">Айдос</span>!</h1>
  <p class="muted text-sm mb-5" data-i="sub"></p>
  <div class="flex justify-between items-center mb-2"><h2 class="font-bold text-sm" data-i="help"></h2><span class="text-xs muted">ҚАЗ ↔ ӘЛЕМ</span></div>
  <div class="grid grid-cols-2 gap-3">
    <button class="card p-4 text-left" onclick="demo('voice')"><div class="text-2xl mb-6">🎙️</div><div class="font-bold" data-i="voiceT"></div><div class="text-xs muted" data-i="voiceS"></div></button>
    <button class="card p-4 text-left" onclick="demo('cam')"><div class="text-2xl mb-6">📷</div><div class="font-bold" data-i="camT"></div><div class="text-xs muted" data-i="camS"></div></button>
    <button class="card p-4 text-left col-span-2" onclick="toast(t('soon'))"><div class="text-2xl mb-2 gold">🪶</div><div class="font-bold text-sm" data-i="wordT"></div><div class="text-xs muted" data-i="wordS"></div></button>
  </div>
  <div id="demo" class="card p-4 mt-4 hidden"></div>
</section>

<section id="set" class="scr">
  <h1 class="text-2xl font-extrabold mb-4" data-i="navSet"></h1>
  <div class="card p-4 flex items-center gap-3">
    <div class="w-14 h-14 rounded-full grid place-items-center text-xl font-bold" style="background:linear-gradient(135deg,var(--cy),var(--gold));color:#04202a">А</div>
    <div class="flex-1"><div class="font-bold" id="pn">—</div><div class="text-xs muted" data-i="loginAs"></div></div>
    <span class="text-xs font-bold px-2 py-1 rounded-lg" style="background:rgba(245,158,11,.18);color:var(--gold)">PRO</span>
  </div>
  <div class="card p-4 mt-3 flex items-center justify-between gap-3">
    <div><div class="font-semibold text-sm" data-i="langT"></div><div class="text-xs muted" data-i="langS"></div></div>
    <div class="relative">
      <button id="langBtn" class="langbtn" aria-haspopup="listbox"><span>🌐</span><span id="langCur">Қазақша</span><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 8l5 5 5-5"/></svg></button>
      <div id="langMenu" class="langmenu hidden" role="listbox">
        <button data-l="kk"><span class="cd">KZ</span>Қазақша</button><button data-l="ru"><span class="cd">RU</span>Русский</button><button data-l="en"><span class="cd">EN</span>English</button>
      </div>
    </div>
  </div>
  <div class="card p-4 mt-3 flex items-center justify-between">
    <div><div class="font-semibold text-sm" data-i="spkT"></div><div class="text-xs muted" data-i="spkS"></div></div>
    <button class="sw on" id="spk" aria-label="Voice"></button>
  </div>
  <button class="btn p w-full mt-4" onclick="logout(1)" data-i="addAcc"></button>
  <button class="btn w-full mt-2" style="color:#f87171;border-color:rgba(248,113,113,.4)" onclick="logout()" data-i="logout"></button>
  <p class="text-center text-xs muted mt-6">Qazart v1.4 · Zere AI</p>
</section>

<div id="ai">
  <div class="flex items-center justify-between p-4" style="border-bottom:1px solid var(--line)">
    <div class="flex items-center gap-3"><div class="w-10 h-10 rounded-full" style="background:radial-gradient(circle at 35% 30%,#7df3ff,#0891b2 60%,#0F172A);box-shadow:0 0 16px rgba(0,229,255,.6)"></div>
      <div><div class="font-bold">Zere AI</div><div class="text-xs cy" data-i="online"></div></div></div>
    <div class="flex gap-2"><button class="btn" id="live" onclick="liveToggle()">📞</button><button class="btn" id="auto" onclick="toggleAuto()">🔁</button><button class="btn" onclick="closeAI()">✕</button></div>
  </div>
  <div id="chat" class="flex-1 overflow-y-auto p-4"></div>
  <div id="wave" class="hidden justify-center items-center gap-1 h-12"></div>
  <div class="flex gap-2 p-3" style="border-top:1px solid var(--line)">
    <button id="mic" class="btn p" style="width:46px;font-size:18px" aria-label="Mic">🎙️</button>
    <input id="inp" data-ph="phAsk" class="flex-1 rounded-xl px-3 text-sm outline-none" style="background:var(--card);border:1px solid var(--line);color:var(--text)">
    <button id="send" class="btn p">➤</button>
  </div>
</div>

<div id="login"><div class="text-3xl font-extrabold mb-1"><span class="cy">✻</span> Qazart</div><p class="muted text-sm mb-4" data-i="tag"></p>
<div class="seg" id="am"><button class="on" data-m="in" data-i="tIn"></button><button data-m="reg" data-i="tReg"></button></div>
<input id="lg" class="in" data-ph="phLogin" autocomplete="username"><input id="pw" type="password" class="in" data-ph="phPass" autocomplete="current-password">
<button class="btn p w-full mt-4" id="go"></button><p id="ae" class="text-sm mt-3" style="color:#f87171"></p></div>

<nav id="nav" class="glass">
  <button class="tab on" data-s="home"><span>🏠</span><i style="font-style:normal" data-i="navHome"></i></button>

<script>

let tt;function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),2200)}

// navigation
$$('.tab').forEach(b=>b.onclick=()=>{$$('.tab').forEach(x=>x.classList.toggle('on',x===b));$$('.scr').forEach(s=>s.classList.toggle('on',s.id===b.dataset.s))});

// home
const LG={kk:['Қазақша','kk-KZ'],ru:['Русский','ru-RU'],en:['English','en-US'],tr:['Türkçe','tr-TR']};
let TM='voice',TF='kk',TT='ru',trRec=null;
function demo(m){camStop();TM=m;if(m=='voice'&&TF=='auto')TF='kk';
 const d=$('#demo');d.classList.remove('hidden');
 const op=v=>Object.keys(LG).map(k=>`<option value="${k}"${k==v?' selected':''}>${LG[k][0]}</option>`).join('');
 d.innerHTML=`<div class="flex items-center gap-2"><select id="tf" class="in" style="margin:0">${m=='cam'?`<option value="auto"${TF=='auto'?' selected':''}>${t('auto')}</option>`:''}${op(TF)}</select><button class="btn" id="tsw">⇄</button><select id="tt" class="in" style="margin:0">${op(TT)}</select></div>`+
 (m=='voice'?`<div class="flex gap-2 mt-3"><button class="btn p" id="tgo" style="width:52px;font-size:18px">🎙️</button><input id="tin" class="in" style="margin:0" placeholder="${t('phTr')}"><button class="btn p" id="tsd">➤</button></div>`:`<button class="btn p w-full mt-3" id="tgo">${t('snap')}</button><input type="file" id="timg" accept="image/*" capture="environment" class="hidden">`)+'<div id="tout" class="mt-3 text-sm"></div>';
 $('#tf').onchange=e=>TF=e.target.value;$('#tt').onchange=e=>TT=e.target.value;
 $('#tsw').onclick=()=>{if(TF=='auto')return toast(t('swapAuto'));[TF,TT]=[TT,TF];demo(TM)};

 else{$('#tgo').onclick=camOpen;$('#timg').onchange=trImg}
 d.scrollIntoView({behavior:'smooth',block:'nearest'})}
async function trListen(){
 if(trRec){trRec.stop();return}
 if(!window.MediaRecorder||!navigator.mediaDevices){toast(t('noRecApi'));return}
 try{speechSynthesis.cancel()}catch(e){}
 let st;try{st=await navigator.mediaDevices.getUserMedia({audio:true})}catch(e){toast(t('mic'));return}
 const ch=[],mt=['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg'].find(x=>MediaRecorder.isTypeSupported(x))||'';
 const r=new MediaRecorder(st,mt?{mimeType:mt}:{});trRec=r;let tm=0,ti=0;const t0=Date.now();
 r.ondataavailable=e=>{if(e.data.size)ch.push(e.data)};
 r.onstop=async()=>{st.getTracks().forEach(x=>x.stop());clearTimeout(tm);clearInterval(ti);trRec=null;const b=$('#tgo');if(b){b.textContent='🎙️';b.classList.add('p')}
  const bl=new Blob(ch,{type:r.mimeType||mt||'audio/webm'});if(bl.size<1500){$('#tout').innerHTML='';toast(t('noVoice'));return}
  const d=await new Promise(res=>{const f=new FileReader();f.onload=()=>res(f.result.split(',')[1]);f.readAsDataURL(bl)});
  trDo({audio:d,mime:bl.type})};
 r.start();$('#tgo').textContent='⏹';$('#tgo').classList.remove('p');
 $('#tout').innerHTML='<p class="cy">🔴 '+t('rec')+' <span id="rt">0:00</span></p>';
 ti=setInterval(()=>{const s=Math.floor((Date.now()-t0)/1e3),e=$('#rt');if(e)e.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0')},500);
 tm=setTimeout(()=>{if(r.state=='recording')r.stop()},20000)}
let camSt=null;
function camStop(){if(camSt){camSt.getTracks().forEach(x=>x.stop());camSt=null}}
async function camOpen(){
 const o=$('#tout');
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){$('#timg').click();return}
 try{
  camStop();
  camSt=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280}},audio:false});
  o.innerHTML='<video id="cv" autoplay playsinline muted class="w-full rounded-xl" style="max-height:300px;background:#000;object-fit:cover"></video><div class="flex gap-2 mt-2"><button class="btn p flex-1" id="cshot">📸 '+t('shot')+'</button><button class="btn" id="cfile" title="'+t('pickFile')+'">🖼️</button><button class="btn" id="cstop">✕</button></div>';
  const v=$('#cv');v.srcObject=camSt;
  $('#cshot').onclick=()=>{if(!v.videoWidth)return;const k=Math.min(1,1280/Math.max(v.videoWidth,v.videoHeight)),c=document.createElement('canvas');c.width=v.videoWidth*k;c.height=v.videoHeight*k;c.getContext('2d').drawImage(v,0,0,c.width,c.height);camStop();sendCanvas(c)};
  $('#cfile').onclick=()=>{camStop();$('#timg').click()};
  $('#cstop').onclick=()=>{camStop();o.innerHTML=''};
 }catch(e){o.innerHTML='<p class="muted">'+t('camErr')+'</p>'}}

function trImg(e){const f=e.target.files[0];if(!f)return;const im=new Image(),u=URL.createObjectURL(f);
 im.onload=()=>{const k=Math.min(1,1280/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);sendCanvas(c)};
 im.onerror=()=>toast(t('imgErr'));im.src=u;e.target.value=''}
async function trDo(p,keep){const o=$('#tout'),pre=keep?o.innerHTML:'';o.innerHTML=pre+'<p class="cy">'+t('trg')+'</p>';
 if(!await ensure(()=>{o.innerHTML=pre+'<p class="cy">'+t('waking')+'</p>'})){o.innerHTML=pre+'<p style="color:#f87171">'+t('noSrv')+'</p>';return}

  $('#tsp').onclick=()=>trSay(d.translation)

": ["Тым көп әрекет, сәлден кейін қайталаңыз", "Слишком много попыток, повторите позже", "Too many attempts, try again later"], "eLoad": ["Firebase жүктелуде, қайталап көріңіз", "Firebase загружается, повторите", "Firebase is loading, try again"], "online": ["● онлайн", "● онлайн", "● online"], "phAsk": ["Zere-ден сұра…", "Спроси Zere…", "Ask Zere…"], "greet": ["Сәлем, {n}! Мен Zere. Жаз немесе 🎙️ басып сөйле.", "Привет, {n}! Я Zere. Пиши или нажми 🎙️ и говори.", "Hi, {n}! I’m Zere. Type or tap 🎙️ and speak."], "noSrv": ["Zere серверіне қосылу мүмкін болмады. Сервер оянып жатқан болуы мүмкін, бір минуттан кейін қайталаңыз.", "Не удалось подключиться к серверу Zere. Возможно, он просыпается, повторите через минуту.", "Couldn’t reach the Zere server. It may be waking up, try again in a minute."], "err": ["Қате", "Ошибка", "Error"], "empty": ["Бос жауап", "Пустой ответ", "Empty reply"], "voiceMsg": ["🎙️ Дауыстық хабарлама", "🎙️ Голосовое сообщение", "🎙️ Voice message"], "conn": ["Zere-ге қосылуда…", "Подключение к Zere…", "Connecting to Zere…"], "speak": ["Сөйлесіңіз, Zere тыңдап тұр 🎧", "Говорите, Zere слушает 🎧", "Speak, Zere is listening 🎧"], "closed": ["Қосылым жабылды", "Соединение закрыто", "Connection closed"], "liveErr": ["Live қосылымында қате", "Ошибка соединения Live", "Live connection error"], "mic": ["Микрофонға рұқсат беріңіз", "Разрешите доступ к микрофону", "Allow microphone access"], "noAudio": ["Бұл браузер аудионы қолдамайды", "Браузер не поддерживает аудио", "This browser doesn’t support audio"], "noSR": ["Дауыс тану үшін Chrome немесе Edge қолданыңыз", "Для распознавания речи используйте Chrome или Edge", "Use Chrome or Edge for speech recognition"], "noVoice": ["Дауыс естілмеді", "Голос не слышен", "No voice detected"], "noRecApi": ["Браузер дауыс жазуды қолдамайды, мәтін жазыңыз", "Браузер не поддерживает запись, введите текст", "Recording not supported, type instead"], "phTr": ["Сөйлеңіз немесе жазыңыз…", "Говорите или пишите…", "Speak or type…"], "snap": ["📷 Суретке түсіру / таңдау", "📷 Снять / выбрать фото", "📷 Take / choose photo"], "auto": ["Авто", "Авто", "Auto"], "trg": ["Аударылуда…", "Перевожу…", "Translating…"], "orig": ["ТҮПНҰСҚА", "ОРИГИНАЛ", "ORIGINAL"], "recog": ["ТАНЫЛҒАН МӘТІН", "РАСПОЗНАННЫЙ ТЕКСТ", "RECOGNIZED TEXT"], "trans": ["АУДАРМА", "ПЕРЕВОД", "TRANSLATION"], "listen": ["🔊 Тыңдау", "🔊 Слушать", "🔊 Listen"], "nf": ["Мәтін табылмады.", "Текст не найден.", "No text found."], "recStart": ["Сөйлеңіз, аяқтаған соң ⏹ басыңыз", "Говорите, затем нажмите ⏹", "Speak, then press ⏹"], "swapAuto": ["«Авто» кезінде тілдерді ауыстыру мүмкін емес", "При «Авто» нельзя поменять языки", "Can’t swap languages in “Auto”"], "imgErr": ["Суретті ашу мүмкін болмады", "Не удалось открыть фото", "Couldn’t open the photo"], "noTTS": ["Озвучка қолжетімсіз", "Озвучка недоступна", "Speech output unavailable"]};

 $$('#langMenu button').forEach(b=>b.classList.toggle('on',b.dataset.l==LN));$('#langCur').textContent=({kk:'Қазақша',ru:'Русский',en:'English'})[LN];$('#go').textContent=t(AM=='in'?'tIn':'tReg');if(!$('#demo').classList.contains('hidden'))demo(TM)}

const R=[['сәлем','Сәлем! Мен Zere — сенің қазақ тілі көмекшіңмін. Не білгің келеді?'],['аударма','Қазақша мәтінді жіберсең, ағылшынға не орысқа аударып беремін.'],['шежіре','Шежіре — жеті атаға дейінгі тарихың. «Шежіре» бөлімінен түйіндерді басып көр.'],['бизнес','Бизнес үшін: қазақша SMM-мәтін, хат шаблондары және терминдер сөздігі бар.']];
function add(t,c){const m=document.createElement('div');m.className='msg '+c;$('#chat').appendChild(m);if(c=='a')typeInto(m,t,()=>$('#chat').scrollTop=1e5);else m.textContent=t;$('#chat').scrollTop=1e5}
const SYS='Сен Zere — Qazart платформасының қазақ тіліндегі AI көмекшісісің. Әрдайым таза, әдемі қазақ тілінде жауап бер (пайдаланушы басқа тілді сұраса ғана ауыстыр). Жауабың қысқа, нақты және достық болсын: 1–4 сөйлем. Дауыстық сөйлесуге арналған, сондықтан markdown, тізім, жұлдызша және эмодзи қолданба. Қазақ тілі, аударма, шежіре, бизнес және медиа тақырыбында көмектес.';
let H=[],SRV=!!AP;
const tok=async()=>window.FB?FB.token():'';
const AH=async()=>({'Content-Type':'application/json',Authorization:'Bearer '+await tok()});
let SRVOK=false;
const em=e=>e.message=='Кіру қажет'?t(FBON?'reLogin':'noFb'):t('err')+': '+e.message;
async function ensure(show){
 if(SRVOK)return true;
 for(let i=0;i<14;i++){                     // ~60 секунд: Render ұйқыдан оянуы
  try{const c=new AbortController(),to=setTimeout(()=>c.abort(),8000);const r=await fetch(AP+'/api/health',{signal:c.signal});clearTimeout(to);const j=await r.json();if(j&&j.ok){SRVOK=SRV=true;return true}}catch(e){}
  if(i==0&&show)show();
  await new Promise(r=>setTimeout(r,2500));
 }
 return false}
async function gem(q){
 if(!CF.key&&!SRV)throw new Error('NOKEY');
 H.push({role:'user',parts:[{text:q}]});H=H.slice(-16);
 try{
  const r=SRV?await fetch(AP+'/api/chat',{method:'POST',headers:await AH(),body:JSON.stringify({contents:H,lang:LN})}):await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(CF.model)+':generateContent',{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':CF.key},body:JSON.stringify({systemInstruction:{parts:[{text:SYS}]},contents:H,generationConfig:{temperature:.7}})});
  const d=await r.json();if(!r.ok)throw new Error((d.error&&d.error.message)||r.status);
  const t=((d.candidates&&d.candidates[0]&&d.candidates[0].content&&d.candidates[0].content.parts)||[]).map(p=>p.text||'').join('').trim();
  if(!t)throw new Error(t('empty'));
  H.push({role:'model',parts:[{text:t}]});return t
 }catch(e){H.pop();throw e}
}
let VO=[];try{VO=speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>VO=speechSynthesis.getVoices()}catch(e){}
let warned=false;
function say(t){return new Promise(res=>{
 if(!CF.speak||!window.speechSynthesis)return res();
 speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(t.replace(/[*_#`]/g,''));
 const v=VO.find(v=>/^kk/i.test(v.lang))||VO.find(v=>/^ru/i.test(v.lang));
 if(!VO.some(v=>/^kk/i.test(v.lang))&&!warned){warned=true;toast('Құрылғыда қазақ дауысы жоқ, орыс дауысы қолданылады')}
 u.lang=v?v.lang:'kk-KZ';if(v)u.voice=v;
 u.onend=u.onerror=()=>res();speechSynthesis.speak(u)})}
function sayQ(t){t=t.replace(/[*_#`]/g,'').trim();if(!t||!CF.speak||!window.speechSynthesis)return;const u=new SpeechSynthesisUtterance(t),v=VO.find(v=>v.lang.toLowerCase().startsWith(LN))||VO.find(v=>/^ru/i.test(v.lang));u.lang=v?v.lang:({kk:'kk-KZ',ru:'ru-RU',en:'en-US'})[LN];if(v)u.voice=v;speechSynthesis.speak(u)}
const sayDone=()=>new Promise(r=>{const c=()=>(speechSynthesis.speaking||speechSynthesis.pending)?setTimeout(c,200):r();c()});
async function ask(q){
 add(q,'u');
 const m=document.createElement('div');m.className='msg a';m.textContent='● ● ●';$('#chat').appendChild(m);$('#chat').scrollTop=1e5;
 try{
  if(!await ensure(()=>{m.textContent=t('waking')}))throw new Error('NOKEY');
  H.push({role:'user',parts:[{text:q}]});H=H.slice(-16);
  try{speechSynthesis.cancel()}catch(e){}
  const r=await fetch(AP+'/api/chat?stream=1',{method:'POST',headers:await AH(),body:JSON.stringify({contents:H,lang:LN})});
  if(!r.ok){const d=await r.json().catch(()=>({}));throw new Error(d.error||r.status)}
  const rd=r.body.getReader(),dc=new TextDecoder(),re=/^[\s\S]*?(?:[.!?…](?=\s)|\n)/;let buf='',full='',sp='';m.textContent='';
  const flush=f=>{let x;while((x=re.exec(sp))){sayQ(x[0]);sp=sp.slice(x[0].length)}if(f&&sp.trim()){sayQ(sp);sp=''}};
  for(;;){const {value,done}=await rd.read();if(done)break;buf+=dc.decode(value,{stream:true});let i;
   while((i=buf.indexOf('\n'))>=0){const ln=buf.slice(0,i).trim();buf=buf.slice(i+1);if(!ln.startsWith('data:'))continue;
    const j=JSON.parse(ln.slice(5));if(j.error)throw new Error(j.error);if(j.t){full+=j.t;sp+=j.t;m.textContent=full;$('#chat').scrollTop=1e5;flush(false)}}}
  flush(true);
  if(!full.trim())throw new Error(t('empty'));
  H.push({role:'model',parts:[{text:full.trim()}]});
  if(auto&&$('#ai').classList.contains('on')){await sayDone();listen()}
 }catch(e){
  if(H.length&&H[H.length-1].role=='user')H.pop();
  m.textContent=e.message=='NOKEY'?t('noSrv')+' ('+(AP||location.origin)+')':em(e);
 }}
function send(){const v=$('#inp').value.trim();if(!v)return;$('#inp').value='';ask(v)}
$('#send').onclick=send;$('#inp').onkeydown=e=>{if(e.key=='Enter')send()};
$('#wave').innerHTML='<i class="bar"></i>'.repeat(9);$$('.bar').forEach((b,i)=>b.style.animationDelay=i*.08+'s');
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rc=null,auto=false;
function wv(on){$('#wave').classList.toggle('hidden',!on);$('#wave').classList.toggle('flex',on);$('#mic').classList.toggle('p',!on)}
function listen(){
 if(!SR){toast(t('noSR'));return}
 if(rc)return;
 try{speechSynthesis.cancel()}catch(e){}
 rc=new SR();rc.lang=({kk:'kk-KZ',ru:'ru-RU',en:'en-US'})[LN];rc.interimResults=false;rc.maxAlternatives=1;
 rc.onstart=()=>wv(true);
 rc.onresult=e=>{const t=e.results[0][0].transcript.trim();if(t)ask(t)};
 rc.onerror=e=>{if(e.error=='not-allowed'||e.error=='service-not-allowed'){toast(t('mic'));auto=false;setAuto()}else if(e.error=='no-speech')toast(t('noVoice'))};
 rc.onend=()=>{rc=null;wv(false)};
 rc.start()}
$('#mic').onclick=()=>{if(rc)rc.stop();else listen()};
function setAuto(){$('#auto').classList.toggle('p',auto)}
function toggleAuto(){auto=!auto;setAuto();toast(auto?'Үздіксіз сөйлесу қосылды':'Үздіксіз сөйлесу өшірілді');if(auto)listen()}
$('#zere').onclick=()=>{$('#ai').classList.add('on');if(!$('#chat').children.length)add(t('greet').replace('{n}',ME),'a')};
function closeAI(){liveStop();$('#ai').classList.remove('on');auto=false;setAuto();try{speechSynthesis.cancel()}catch(e){}if(rc)rc.abort()}
const CF=(()=>{try{return JSON.parse(localStorage.getItem('qz-cfg'))||{}}catch(e){return{}}})();
CF.model=CF.model||'gemini-2.5-flash';if(CF.speak===undefined)CF.speak=true;
const saveCF=()=>{try{localStorage.setItem('qz-cfg',JSON.stringify(CF))}catch(e){}};
$('#spk').classList.toggle('on',CF.speak);
$('#spk').onclick=e=>{CF.speak=!CF.speak;e.currentTarget.classList.toggle('on',CF.speak);saveCF()};

// theme
function theme(d){document.documentElement.dataset.theme=d?'dark':'light';$('#thm').textContent=d?'☀️':'🌙';try{localStorage.setItem('qz-dark',d?'1':'0')}catch(e){}}
$('#thm').onclick=()=>theme(document.documentElement.dataset.theme!='dark');
try{if(localStorage.getItem('qz-dark')=='0')theme(false)}catch(e){}
// live voice
const WL=URL.createObjectURL(new Blob([`class P extends AudioWorkletProcessor{constructor(){super();this.b=new Int16Array(1600);this.n=0}process(i){const f=i[0][0];if(!f)return true;for(let k=0;k<f.length;k++){this.b[this.n++]=Math.max(-1,Math.min(1,f[k]))*32767;if(this.n==1600){this.port.postMessage(this.b.buffer.slice(0));this.n=0}}return true}}registerProcessor('qp',P)`],{type:'application/javascript'}));
let ws,ac,pa,ms,sp,nt=0,srcs=[],lv=false,ub=null,ab=null;
const b64=b=>{let s='',u=new Uint8Array(b);for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(s)};
function bub(c){const m=document.createElement('div');m.className='msg '+c;$('#chat').appendChild(m);return m}
function play(d){const bin=atob(d),n=bin.length>>1,f=new Float32Array(n);for(let i=0;i<n;i++){let v=bin.charCodeAt(2*i)|bin.charCodeAt(2*i+1)<<8;if(v>32767)v-=65536;f[i]=v/32768}
 const bf=pa.createBuffer(1,n,24000);bf.copyToChannel(f,0);const s=pa.createBufferSource();s.buffer=bf;s.connect(pa.destination);nt=Math.max(nt,pa.currentTime+.08);s.start(nt);nt+=bf.duration;srcs.push(s);s.onended=()=>srcs=srcs.filter(x=>x!==s)}
async function liveToggle(){
 if(lv)return liveStop();
 if(!await ensure(()=>toast(t('waking')))){toast(t('noSrv'));return}
 try{speechSynthesis.cancel()}catch(e){}
 try{ac=new AudioContext({sampleRate:16000});pa=new AudioContext({sampleRate:24000});ac.resume();pa.resume()}catch(e){toast(t('noAudio'));return}
 try{ms=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}})}catch(e){toast(t('mic'));try{ac.close();pa.close()}catch(_){}return}
 lv=true;$('#live').classList.add('p');toast(t('conn'));
 ws=new WebSocket(SRV?(AP?AP.replace(/^http/,'ws'):(location.protocol=='https:'?'wss://':'ws://')+location.host)+'/api/live':'wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent?key='+encodeURIComponent(CF.key));
 ws.onopen=async()=>SRV?ws.send(JSON.stringify({auth:await tok(),lang:LN})):ws.send(JSON.stringify({setup:{model:'models/'+(CF.live||'gemini-2.5-flash-native-audio-preview-09-2025'),generationConfig:{responseModalities:['AUDIO']},systemInstruction:{parts:[{text:SYS+' Қазақ тілінде сөйле.'}]},inputAudioTranscription:{},outputAudioTranscription:{}}}));
 ws.onmessage=async e=>{const m=JSON.parse(typeof e.data=='string'?e.data:await e.data.text());
  if(m.setupComplete){toast(t('speak'));const src=ac.createMediaStreamSource(ms);
   await ac.audioWorklet.addModule(WL);const nd=new AudioWorkletNode(ac,'qp');sp=nd;
   nd.port.onmessage=ev=>{if(ws.readyState==1)ws.send(JSON.stringify({realtimeInput:{audio:{data:b64(ev.data),mimeType:'audio/pcm;rate=16000'}}}))};src.connect(nd)}
  const c=m.serverContent;if(!c)return;
  if(c.interrupted){srcs.forEach(x=>{try{x.stop()}catch(_){}});srcs=[];nt=0}
  if(c.modelTurn)c.modelTurn.parts.forEach(p=>p.inlineData&&play(p.inlineData.data));
  if(c.inputTranscription&&!ub){ab=null;ub=bub('u');ub.textContent=t('voiceMsg')}
  if(c.outputTranscription&&c.outputTranscription.text){ub=null;const x=c.outputTranscription.text;if(LN=='en'||!/[A-Za-z\u0600-\u06FF\u3040-\u30FF\u4E00-\u9FFF\uAC00-\uD7AF]/.test(x)){(ab=ab||bub('a')).textContent+=x}else if(!ab){ab=bub('a');ab.textContent='🔊'}}
  if(c.turnComplete){ub=ab=null}
  $('#chat').scrollTop=1e5};
 ws.onerror=()=>toast(t('liveErr'));
 ws.onclose=ev=>{if(lv){toast(t('closed')+(ev.reason?': '+ev.reason.slice(0,80):''));liveStop()}}}
function liveStop(){if(!lv)return;lv=false;$('#live').classList.remove('p');try{ws.close()}catch(e){}try{sp.disconnect()}catch(e){}try{ms.getTracks().forEach(t=>t.stop())}catch(e){}try{ac.close();pa.close()}catch(e){}srcs=[];ub=ab=null;nt=0}

// auth (prototype only: localStorage + PBKDF2)
let AM='in';
const US=()=>{try{return JSON.parse(localStorage.getItem('qz-users'))||{}}catch(e){return{}}};
async function hs(p,salt){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(p),'PBKDF2',false,['deriveBits']);return b64(await crypto.subtle.deriveBits({name:'PBKDF2',salt:new TextEncoder().encode(salt),iterations:100000,hash:'SHA-256'},k,256))}
$$('#am button').forEach(b=>b.onclick=()=>{AM=b.dataset.m;$$('#am button').forEach(x=>x.classList.toggle('on',x===b));$('#go').textContent=t(AM=='in'?'tIn':'tReg');$('#ae').textContent=''});
$('#go').onclick=async()=>{const l=$('#lg').value.trim().toLowerCase(),p=$('#pw').value,e=$('#ae'),u=US();e.textContent='';
 if(!window.crypto||!crypto.subtle){e.textContent=t('eSecure');return}
 if(!/^[a-z0-9_.-]{3,20}$/.test(l)){e.textContent=t('eLogin');return}
 if(p.length<6){e.textContent=t('ePass');return}
 if(FBON)return fbAuth(l,p,e);
 if(AM=='reg'){if(u[l]){e.textContent=t('eTaken');return}const salt=b64(crypto.getRandomValues(new Uint8Array(12)));u[l]={salt,h:await hs(p,salt)};localStorage.setItem('qz-users',JSON.stringify(u))}
 else{if(!u[l]||u[l].h!=await hs(p,u[l].salt)){e.textContent=t('eBad');return}}
 try{localStorage.setItem('qz-ses',l)}catch(_){}enter(l)};
function enter(l){ME=l;$('#login').style.display='none';$('#pw').value='';$('#pn').textContent=l;$('#hi').textContent=l;}
function logout(reg){liveStop();if(FBON&&window.FB)FB.signOut();try{localStorage.removeItem('qz-ses')}catch(e){}$('#login').style.display='flex';$('#am button[data-m="'+(reg?'reg':'in')+'"]').click();$('#lg').value=''}
ensure();
if(!FBON)try{const ss=localStorage.getItem('qz-ses');if(ss&&US()[ss])enter(ss)}catch(e){}
async function fbAuth(l,p,e){if(!window.FB){e.textContent=t('eLoad');return}
 try{await FB.auth(l,p,AM=='reg')}catch(x){const c=x.code||'';e.textContent=c=='auth/email-already-in-use'?t('eTaken'):(c=='auth/invalid-credential'||c=='auth/wrong-password'||c=='auth/user-not-found')?t('eBad'):c=='auth/weak-password'?t('eWeak'):c=='auth/operation-not-allowed'?t('eOp'):c=='auth/too-many-requests'?t('eMany'):t('err')+': '+(x.message||c)}}
applyLang();
</script>
<script type="module">
if(window.FIREBASE_CONFIG&&window.FIREBASE_CONFIG.apiKey){
 const B='https://www.gstatic.com/firebasejs/10.14.1/';
 const [{initializeApp},A]=await Promise.all([import(B+'firebase-app.js'),import(B+'firebase-auth.js')]);
 const {getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut}=A;
 const au=getAuth(initializeApp(window.FIREBASE_CONFIG)),dom='@users.qazart.app';
 window.FB={token:async()=>au.currentUser?au.currentUser.getIdToken():'',signOut:()=>signOut(au),
  async auth(l,p,reg){if(reg)await createUserWithEmailAndPassword(au,l+dom,p);else await signInWithEmailAndPassword(au,l+dom,p)}};
 onAuthStateChanged(au,u=>{if(u)enter((u.email||'').replace(dom,''))});
}
</script>
